# Python packaging for the LaueMatching orchestration package (laue_index).
# The C/CUDA core lives in this package's own c_src/ and is compiled by the
# CMakeLists.txt beside this file; the repo-root build reaches down into the
# same directory, so there is exactly one copy of the C.
[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "laue-index"
version = "0.3.3"
description = "LaueMatching Python orchestration: typed pipeline stages for white-beam Laue indexing"
readme = "laue_index/README.md"
requires-python = ">=3.9"
license = "BSD-3-Clause"
authors = [{ name = "Hemant Sharma", email = "hsharma@anl.gov" }]
dependencies = [
    "numpy",
]

# Heavier, environment-specific deps used by the full pipeline (preprocessing,
# I/O).  Kept optional so the pure core (records/geometry/filtering/thresholds/
# config_schema) imports with numpy alone.
[project.optional-dependencies]
pipeline = ["opencv-python-headless", "scipy", "h5py"]
preprocess = ["diplib", "scikit-image"]
# Everything `laue-index run` needs. The orchestration modules ship inside the
# package (laue_index/pipeline/), but their dependencies are heavy and only
# matter if you actually run the pipeline, so they stay optional.
run = [
    "laue-index[pipeline]",    # cv2, scipy, h5py -- laue_index.preprocess
    "laue-index[preprocess]",  # diplib, scikit-image -- ImageCleanup, RunImage
    "PyYAML",                  # laue_config, RunImage
    "matplotlib",              # ImageCleanup, RunImage
    "plotly",                  # RunImage
    "tqdm",                    # RunImage
    "Pillow",                  # ImageCleanup, GenerateSimulation
]
# dev must cover the WHOLE pipeline, not just the library: the characterization
# tests import RunImage, laue_config and friends, and those pull yaml, plotly,
# diplib and matplotlib at MODULE level -- so without them the suite cannot
# even COLLECT. Every entry was invisible locally (the dev env had them via
# other packages) and failed only on CI's clean runner: first 11 collection
# errors reading "No module named 'cv2'", then 'yaml'.
dev = [
    "pytest>=7.0",
    "laue-index[run]",
]

[project.scripts]
laue-index = "laue_index.cli:main"

[tool.scikit-build]
cmake.version = ">=3.20"
cmake.source-dir = "."
wheel.packages = ["laue_index"]
build-dir = "build/{wheel_tag}"
# The C target returns early rather than erroring when a compiler or OpenMP is
# absent, so `pip install` still succeeds Python-only and
# laue_index.indexer.available() reports False at runtime.

[tool.pytest.ini_options]
testpaths = ["tests"]
# The full end-to-end test is opt-in (needs the orientation DB + C binary +
# forward cache); it auto-skips unless LAUE_E2E=1, so `pytest` is CI-safe with
# SKIP_DOWNLOAD=1 (no orientation database required for the unit suite).
addopts = "-q"
