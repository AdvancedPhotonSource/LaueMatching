# Python packaging for the LaueMatching orchestration package (laue_index).
# The C/CUDA core (src/, built via CMakeLists.txt + build.sh) is independent;
# this packages only the Python side (REFACTOR_PLAN §6.6).
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "laue-index"
version = "0.1.0"
description = "LaueMatching Python orchestration: typed pipeline stages for white-beam Laue indexing"
readme = "laue_index/README.md"
requires-python = ">=3.9"
license = "BSD-3-Clause"
authors = [{ name = "Hemant Sharma", email = "hsharma@anl.gov" }]
dependencies = [
    "numpy",
]

# Heavier, environment-specific deps used by the full pipeline (preprocessing,
# I/O).  Kept optional so the pure core (records/geometry/filtering/thresholds/
# config_schema) imports with numpy alone.
[project.optional-dependencies]
pipeline = ["opencv-python-headless", "scipy", "h5py"]
preprocess = ["diplib", "scikit-image"]
# dev must cover the WHOLE legacy script stack, not just this package. The
# characterization tests import scripts/ (RunImage, laue_config, ...) as the
# behaviour baseline, and those modules import yaml/matplotlib/plotly/tqdm and
# the pipeline+preprocess stacks at MODULE level -- so `.[dev]` alone cannot
# even COLLECT the suite.
#
# Every entry below was invisible locally (the dev env had them via other
# packages) and failed only on CI's clean runner: first 11 collection errors
# reading "No module named 'cv2'", then 'yaml'. Enumerated by AST-walking every
# import in laue_index/, tests/ and scripts/ and checking each against a fresh
# venv, rather than discovered one CI round at a time.
dev = [
    "pytest>=7.0",
    "laue-index[pipeline]",    # cv2, scipy, h5py -- laue_index.preprocess
    "laue-index[preprocess]",  # diplib, scikit-image -- ImageCleanup, RunImage
    "PyYAML",                  # laue_config, RunImage
    "matplotlib",              # ImageCleanup, RunImage
    "plotly",                  # RunImage
    "tqdm",                    # RunImage
    "Pillow",                  # ImageCleanup, GenerateSimulation
]

[project.scripts]
laue-index = "laue_index.cli:main"

[tool.setuptools]
packages = ["laue_index"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The full end-to-end test is opt-in (needs the orientation DB + C binary +
# forward cache); it auto-skips unless LAUE_E2E=1, so `pytest` is CI-safe with
# SKIP_DOWNLOAD=1 (no orientation database required for the unit suite).
addopts = "-q"
