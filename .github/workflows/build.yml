name: Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*", "laue-*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-cpu:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential
        
    - name: Vendored C is in sync
      # packages/laue_index/c_src/ is a deliberate copy of src/ so that
      # `pip install laue-index` can compile from its own sdist. A one-copy
      # edit would leave the pip-installed indexer running different code from
      # the one this job builds, with every test still green.
      run: python3 utils/sync_vendored_c.py --check

    - name: Build
      run: SKIP_DOWNLOAD=1 ./build.sh
      
    - name: Verify Executable
      run: |
        if [ -f bin/LaueMatchingCPU ]; then
          echo "Build successful: binary found."
          ./bin/LaueMatchingCPU --help || true
        else
          echo "Build failed: binary not found."
          exit 1
        fi

    # The binaries were built and then thrown away on every push. Keep them:
    # they are what a user without a compiler needs, and CI already made them.
    - name: Upload CPU binary
      uses: actions/upload-artifact@v4
      with:
        name: LaueMatchingCPU-linux-x86_64
        path: bin/LaueMatchingCPU
        if-no-files-found: error

    - name: Attach to the release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: bin/LaueMatchingCPU

  build-gpu:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.6.3-devel-ubuntu24.04
    timeout-minutes: 15
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y cmake build-essential git

    - name: Build (GPU)
      run: SKIP_DOWNLOAD=1 ./build.sh gpu

    - name: Verify Executables
      run: |
        for bin in LaueMatchingCPU LaueMatchingGPU LaueMatchingGPUStream; do
          if [ -f "bin/$bin" ]; then
            echo "✓ $bin built successfully"
          else
            echo "✗ $bin not found"
            exit 1
          fi
        done

    - name: Upload CUDA binaries
      uses: actions/upload-artifact@v4
      with:
        name: LaueMatching-cuda12.6-linux-x86_64
        path: |
          bin/LaueMatchingGPU
          bin/LaueMatchingGPUStream
        if-no-files-found: error

    - name: Attach to the release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          bin/LaueMatchingGPU
          bin/LaueMatchingGPUStream
