name: Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*", "laue-*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-cpu:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential
        
    - name: Build
      run: SKIP_DOWNLOAD=1 ./build.sh
      
    - name: Verify Executable
      run: |
        if [ -f bin/LaueMatchingCPU ]; then
          echo "Build successful: binary found."
          ./bin/LaueMatchingCPU --help || true
        else
          echo "Build failed: binary not found."
          exit 1
        fi

    # The binaries were built and then thrown away on every push. Keep them:
    # they are what a user without a compiler needs, and CI already made them.
    - name: Upload CPU binary
      uses: actions/upload-artifact@v4
      with:
        name: LaueMatchingCPU-linux-x86_64
        path: bin/LaueMatchingCPU
        if-no-files-found: error

    - name: Attach to the release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: bin/LaueMatchingCPU

  build-gpu:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.6.3-devel-ubuntu24.04
    timeout-minutes: 15
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y cmake build-essential git

    - name: Build (GPU)
      run: SKIP_DOWNLOAD=1 ./build.sh gpu

    - name: Verify Executables
      run: |
        for bin in LaueMatchingCPU LaueMatchingGPU LaueMatchingGPUStream; do
          if [ -f "bin/$bin" ]; then
            echo "✓ $bin built successfully"
          else
            echo "✗ $bin not found"
            exit 1
          fi
        done

    - name: Upload CUDA binaries
      uses: actions/upload-artifact@v4
      with:
        name: LaueMatching-cuda12.6-linux-x86_64
        path: |
          bin/LaueMatchingGPU
          bin/LaueMatchingGPUStream
        if-no-files-found: error

    - name: Attach to the release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: |
          bin/LaueMatchingGPU
          bin/LaueMatchingGPUStream

  # `LAUEMATCHING_CUDA=1 pip install laue-index` must produce the GPU binaries,
  # and a plain install must NOT. Both halves are checked here because both can
  # break invisibly: the sdist can ship without the .cu, and the opt-in can
  # quietly become an opt-out. The equivalent gap for the CPU binary (a
  # CMakeLists reaching up to a repo-root src/, which works in a checkout and
  # produces nothing from an sdist) shipped once already -- which is why the C
  # now lives ONLY in packages/laue_index/c_src/ and the root build reaches down.
  pip-cuda:
    name: pip install --with CUDA
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.6.3-devel-ubuntu24.04
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: Install prerequisites
      run: |
        apt-get update
        apt-get install -y cmake build-essential git python3 python3-pip python3-venv

    - name: Build the sdist
      # Install the SDIST, never the directory: a directory install lets CMake
      # see files the published artifact does not carry.
      run: |
        python3 -m venv /tmp/venv
        . /tmp/venv/bin/activate
        pip install --upgrade pip build
        python -m build --sdist packages/laue_index --outdir /tmp/dist
        tar -tzf /tmp/dist/*.tar.gz | grep -E 'c_src/.*\.cu$' || {
          echo "::error::the sdist carries no CUDA sources"; exit 1; }

    - name: LAUEMATCHING_CUDA=require produces the GPU binaries
      # No GPU in the runner, so the architecture probe finds nothing and falls
      # back to `all-major` -- which is the point: it must not need a card, and
      # it must not name an architecture this toolkit dropped.
      run: |
        . /tmp/venv/bin/activate
        LAUEMATCHING_CUDA=require pip install /tmp/dist/*.tar.gz
        BIN=$(python -c "import laue_index, os; print(os.path.join(os.path.dirname(laue_index.__file__), 'bin'))")
        ls -l "$BIN"
        for b in LaueMatchingCPU LaueMatchingGPU LaueMatchingGPUStream; do
          test -x "$BIN/$b" || { echo "::error::$b missing from the installed package"; exit 1; }
        done
        python - <<'PY'
        from laue_index import indexer
        assert indexer.available(), "CPU binary not discoverable"
        assert indexer.available("GPU"), "GPU binary not discoverable"
        print("GPU binary at", indexer.binary_path("GPU"))
        PY

    - name: A plain install BUILDS the GPU binaries when nvcc is present
      # Since 0.6.0 the CUDA build is attempted by default, in an isolated
      # sub-project that cannot take the CPU binary down if it fails. This step
      # used to assert the opposite ("a plain install stays CPU-only") and is
      # the contract that changed -- it is kept, inverted, rather than deleted,
      # because "does a plain install in a CUDA container get a GPU binary" is
      # exactly the behaviour worth pinning.
      run: |
        python3 -m venv /tmp/venv_plain
        . /tmp/venv_plain/bin/activate
        pip install --upgrade pip
        pip install /tmp/dist/*.tar.gz
        BIN=$(python -c "import laue_index, os; print(os.path.join(os.path.dirname(laue_index.__file__), 'bin'))")
        test -x "$BIN/LaueMatchingCPU" || { echo "::error::CPU binary missing"; exit 1; }
        for b in LaueMatchingGPU LaueMatchingGPUStream; do
          test -x "$BIN/$b" || { echo "::error::plain install did not build $b, but nvcc is present"; exit 1; }
        done
        python -c "
        from laue_index.buildmeta import build_info
        i = build_info(); c = i['cuda']
        assert i['available'], 'no build manifest'
        assert c['mode'] == 'auto' and c['built'], c
        assert c['architectures'], 'no architectures recorded'
        print('manifest:', c['mode'], c['nvcc_version'], c['architectures'][:60])
        "

    - name: LAUEMATCHING_CUDA=0 stays CPU-only
      run: |
        python3 -m venv /tmp/venv_off
        . /tmp/venv_off/bin/activate
        pip install --upgrade pip
        LAUEMATCHING_CUDA=0 pip install /tmp/dist/*.tar.gz
        BIN=$(python -c "import laue_index, os; print(os.path.join(os.path.dirname(laue_index.__file__), 'bin'))")
        test -x "$BIN/LaueMatchingCPU" || { echo "::error::CPU binary missing"; exit 1; }
        if [ -e "$BIN/LaueMatchingGPU" ]; then
          echo "::error::LAUEMATCHING_CUDA=0 still built the GPU binary"; exit 1
        fi

    - name: LAUEMATCHING_CUDA=1 maps to ATTEMPT, not REQUIRE
      # 0.6.0 redefined `=1` as "require", so installs on machines without nvcc
      # started failing where they had succeeded CPU-only -- every README from
      # the opt-in era tells people to type exactly that. Assert the MODE the
      # manifest records rather than trying to hide nvcc from the build: an
      # earlier version of this step set PATH=/usr/bin:/bin to do that, which
      # also hid the venv, so pip fell back to the system interpreter and died
      # with PEP 668 externally-managed-environment -- a step failing for its
      # own reasons and blaming the package.
      run: |
        python3 -m venv /tmp/venv_one
        . /tmp/venv_one/bin/activate
        pip install --upgrade pip
        LAUEMATCHING_CUDA=1 pip install /tmp/dist/*.tar.gz
        python -c "
        from laue_index.buildmeta import build_info
        m = build_info()['cuda']['mode']
        assert m == 'auto', f'=1 must mean attempt; manifest says mode={m!r}'
        print('LAUEMATCHING_CUDA=1 -> mode', m)
        "

    - name: A CUDA build that fails does NOT fail the install
      # The whole point of the isolated sub-project. Break the CUDA compiler and
      # the CPU binary must still ship, exit 0, with the manifest saying why.
      run: |
        python3 -m venv /tmp/venv_deg
        . /tmp/venv_deg/bin/activate
        pip install --upgrade pip
        pip install --config-settings=cmake.define.CMAKE_CUDA_COMPILER=/bin/false \
          /tmp/dist/*.tar.gz \
          || { echo "::error::a broken CUDA toolchain failed the whole install"; exit 1; }
        BIN=$(python -c "import laue_index, os; print(os.path.join(os.path.dirname(laue_index.__file__), 'bin'))")
        test -x "$BIN/LaueMatchingCPU" || { echo "::error::CPU binary lost to a CUDA failure"; exit 1; }
        python -c "
        from laue_index.buildmeta import build_info
        c = build_info()['cuda']
        assert not c['built'], c
        print('degraded cleanly:', c['reason'][:80])
        "

    - name: The installed package can actually run something
      # Binaries without an orchestrator index nothing. The pipeline modules
      # must be in the wheel, and the CLI must expose them.
      run: |
        . /tmp/venv_plain/bin/activate
        python - <<'PY'
        from laue_index.pipeline import PIPELINE_DIR, SCRIPTS
        missing = [n for n in SCRIPTS if not (PIPELINE_DIR / f"{n}.py").is_file()]
        assert not missing, f"not shipped: {missing}"
        for helper in ("laue_config", "laue_stream_utils", "laue_visualization",
                       "laue_simulation", "laue_provenance", "laue_indexfile"):
            assert (PIPELINE_DIR / f"{helper}.py").is_file(), f"not shipped: {helper}"
        print(f"pipeline ships {len(list(PIPELINE_DIR.glob('*.py')))} modules")
        PY
        laue-index --help | grep -q 'run ' || { echo "::error::laue-index run is missing"; exit 1; }
        laue-index --help | grep -q 'fetch-db' || { echo "::error::laue-index fetch-db is missing"; exit 1; }
